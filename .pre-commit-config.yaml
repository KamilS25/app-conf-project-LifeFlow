repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets with Gitleaks
        language: docker_image
        entry: ghcr.io/gitleaks/gitleaks:v8.30.1 git --staged --redact=100 --no-banner
        pass_filenames: false
