[project]
name = "lifeflow"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit>=4,<5",
    "ruff==0.17.1",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
