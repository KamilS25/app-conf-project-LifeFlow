[project]
name = "lifeflow"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy==2.4.0",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "ruff==0.17.1",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "migrations/*", "tests/*"]
