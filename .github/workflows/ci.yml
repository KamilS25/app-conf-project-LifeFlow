name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.7"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run --locked ruff check .

      - name: ruff format --check
        run: uv run --locked ruff format --check .

      - name: mypy
        run: uv run --locked mypy .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for tracked ignored files
        run: |
          tracked_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [[ -n "$tracked_ignored" ]]; then
            printf 'Remove ignored files from Git:\n%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Gitleaks (files)
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir --redact=100 --no-banner --no-color .

      - name: Gitleaks (history)
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact=100 --no-banner --no-color --log-opts=--all .
